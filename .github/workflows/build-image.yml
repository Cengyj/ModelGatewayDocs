name: Build prebuilt container image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      site_url:
        description: Public URL baked into Docusaurus. Leave empty to use repository variable SITE_URL or the default.
        required: false
        default: ""
      image_tag:
        description: Extra image tag to publish, for example prod or 2026-07-07. latest and sha-* are always published.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve build settings
        id: settings
        shell: bash
        env:
          INPUT_SITE_URL: ${{ inputs.site_url }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          VAR_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          site_url="${INPUT_SITE_URL:-$VAR_SITE_URL}"
          site_url="${site_url:-https://www.foropencode.com}"

          short_sha="${GITHUB_SHA::12}"
          tags="ghcr.io/cengyj/model-gateway-docs:latest"$'\n'"ghcr.io/cengyj/model-gateway-docs:sha-${short_sha}"

          if [ -n "$INPUT_IMAGE_TAG" ]; then
            tags="${tags}"$'\n'"ghcr.io/cengyj/model-gateway-docs:${INPUT_IMAGE_TAG}"
          fi

          echo "site_url=${site_url}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.settings.outputs.tags }}
          build-args: |
            SITE_URL=${{ steps.settings.outputs.site_url }}
            ALGOLIA_APP_ID=${{ vars.ALGOLIA_APP_ID }}
            ALGOLIA_SEARCH_API_KEY=${{ secrets.ALGOLIA_SEARCH_API_KEY }}
            ALGOLIA_INDEX_NAME=${{ vars.ALGOLIA_INDEX_NAME }}
