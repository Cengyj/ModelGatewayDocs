name: Build and push Docker image

on:
  push:
    branches: [main]
    # Docs-only changes to non-runtime files still rebuild (content lives in src/);
    # skip only repo meta that never reaches the image.
    paths-ignore:
      - "AUDIT_REPORT.md"
      - "README.md"
      - "DEPLOY.md"
      - ".claude/**"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # ghcr.io requires a lowercase image name
  IMAGE_NAME: cengyj/modelgatewaydocs

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
