services:
  docs:
    # Default: pull the prebuilt image from GHCR (built by GitHub Actions on
    # every push to main). For a local source build instead, set
    # IMAGE_NAME=foropencode-docs in .env and run `docker compose up -d --build`.
    image: ${IMAGE_NAME:-ghcr.io/cengyj/modelgatewaydocs}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3020"
      HOSTNAME: 0.0.0.0
    user: "1001:1001"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0700
    pids_limit: 256
    ports:
      - "${HOST_PORT:-8081}:3020"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3020/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
