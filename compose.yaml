services:
  docs:
    image: ${IMAGE_NAME:-micuapi-docs}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3020"
      HOSTNAME: 0.0.0.0
    ports:
      - "${HOST_PORT:-8081}:3020"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3020/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
